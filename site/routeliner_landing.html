:root{

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
section[id],[id]{scroll-margin-top:74px}
body{margin:0;background:var(--paper);color:var(--ink);

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
a{color:inherit}

.eyebrow{font-size:13px;font-weight:600;letter-spacing:.16em;

.eyebrow::before{content:"";width:26px;height:2px;background:var(--amber);
  display:inline-block}
.hdr{position:sticky;top:0;z-index:20;background:rgba(241,243,238,.86);

.hdr .wrap{display:flex;align-items:center;justify-content:space-between;
  height:62px;gap:18px}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--display);
  font-weight:700;text-decoration:none;font-size:20px}
.brand span{font-family:var(--body);font-weight:500;font-size:13px;
  color:var(--ink-soft)}
.right{display:flex;align-items:center;gap:22px}
.nav{display:flex;gap:22px;font-size:15px}
.nav a{text-decoration:none;color:var(--ink-soft)}
.nav a:hover{color:var(--teal-deep)}
@media(max-width:860px){.nav{display:none}}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;font-size:13px;font-weight:600}
.lang button{border:0;background:transparent;padding:6px 11px;cursor:pointer;
  font:inherit;color:var(--ink-soft)}
.lang button.on{background:var(--teal);color:#fff}
.hero{padding:74px 0 48px}
.hero h1{font-size:clamp(34px,5vw,56px);max-width:18ch}
.hero .lead{margin-top:22px;font-size:20px;max-width:64ch;color:var(--ink-soft)}
.cta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 22px;border-radius:var(--r);
  text-decoration:none;font-weight:600;font-size:16px}
.btn-main{background:var(--teal);color:#fff}
.btn-main:hover{background:var(--teal-deep)}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal)}
section{padding:56px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(26px,3.3vw,38px);max-width:24ch}
section .sub{margin-top:16px;max-width:70ch;color:var(--ink-soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
@media(max-width:860px){.pair{grid-template-columns:1fr}}
.card{background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--r);padding:22px 24px}
.card h3{font-size:19px;margin-bottom:10px}
.card p{color:var(--ink-soft);font-size:16px}
.tools{margin-top:34px;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:#fff}
.tool{display:grid;grid-template-columns:88px 1fr;
  border-bottom:1px solid var(--line)}
.tool:last-child{border-bottom:none}
.tool .num{background:var(--paper-2);padding:16px 12px;font-weight:600;
  font-family:var(--display);color:var(--teal-deep);text-align:center}
.tool .txt{padding:16px 20px}
.tool .txt b{display:block;font-size:16px}
.tool .txt span{color:var(--ink-soft);font-size:15px}
.tool.off .num{color:var(--ink-soft)}
.tool.off .txt b{color:var(--ink-soft)}
.group{background:var(--paper-2);padding:10px 20px;font-size:13px;
  font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--teal-deep);border-bottom:1px solid var(--line)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px}
@media(max-width:860px){.facts{grid-template-columns:1fr}}
.fact{border-left:3px solid var(--amber);padding-left:16px}
.fact b{display:block;font-family:var(--display);font-size:30px;line-height:1.1}
.fact span{color:var(--ink-soft);font-size:15px}
.limits{margin:28px 0 0;padding-left:22px;max-width:76ch;color:var(--ink-soft)}
.limits li{margin-top:10px}
.ftr{padding:40px 0 60px;border-top:1px solid var(--line);
  color:var(--ink-soft);font-size:15px}
.ftr a{color:var(--teal-deep)}
</style>

o the error table with a reason code. A longitudinal profile with raster levels, grades and ledger stations is built along a route.", "idea.c1.h": "Chainage by the ledger", "idea.c1.p": "Broken pickets and station equations are taken into account in events, stakeout, point locating and the profile. The chainage comes from the ledger, from control points or from the length along the axis.", "idea.c2.h": "Chainage in M values", "idea.c2.p": "The route chainage can be taken from the M values of its geometry and written into the M of the results. PostGIS, ArcGIS and the QGIS tools for M read such layers.", "tools.eyebrow": "Eleven tools", "tools.h2": "A tool has the same number in the toolbox, the menu and the manual", "tools.sub": "The tools sit in the Processing Toolbox in the Routeliner group and are repeated in the Plugins - Routeliner menu under the same numbers. All of them work in models and in batch mode.", "rg.eyebrow": "Without QGIS", "rg.h2": "Routeliner for RustGIS", "rg.sub": "Eight tools of the plugin run in RustGIS, a desktop GIS written in Rust. The computation repeats the plugin and is checked against all 20 of its runs. QGIS is not needed.", "rg.c1.h": "What it does", "rg.c1.p": "Route check and calibration, point events and sections, picket stakeout, point locating, the longitudinal profile table and drawing. The tool numbers, the rl_* fields and the error codes are the same as in the plugin.", "rg.c2.h": "How it differs from the plugin", "rg.c2.p": "The extension has its own RustGIS ribbon tab. RustGIS 0.6.0 has no live layers, no demo example, no rasters and no M values. RustGIS 0.6.0 or newer and Windows are required.", "rg.page": "Extension page", "rg.release": "Release 0.1.1", "rg.code": "Extension source code", "inst.eyebrow": "Installation and documentation", "inst.h2": "The QGIS plugin repository or a ZIP archive", "inst.sub": "The plugin is installed from the QGIS plugin repository or from a ZIP archive through Plugins - Manage and Install Plugins - Install from ZIP. It requires QGIS 3.40 or newer, QGIS 4 on Qt6 included. There are no external dependencies, the computation runs on the NumPy that ships with QGIS. The interface language follows the language of QGIS.", "inst.c1.h": "Manual", "inst.c1.p": "The PDF manual opens from Plugins - Routeliner - Manual (PDF) and describes the tool parameters and the fields of every layer the plugin creates. The manual comes in Russian and English.", "inst.c2.h": "Work log", "inst.c2.p": "The About button on the Routeliner toolbar shows the version, the version history and the work log. The log is written to routeliner.log in the QGIS profile folder, and in case of an error it is enough to attach it to a message.", "inst.catalog": "Version 0.5.4 in the repository", "inst.releases": "Releases on GitHub", "ftr.line1": "GNU GPL v2 or later · QGIS 3.40 and newer", "ftr.line2": "Developed by Inform++ LLC", "ftr.line3": "Routeliner grows on the tasks of real enterprises. If your operation is missing a feature, write to us.", "g1": "1. Preparation", "t101.h": "Demo example", "t101.p": "GeoPackage with reference answers and a self-check of the plugin.", "t102.h": "Route check", "t102.p": "Assembled routes, gaps and branches.", "t103.h": "Calibrate routes", "t103.p": "Routes with chainage in the M values of their vertices.", "g2": "2. Events by station", "t201.h": "Point events", "t201.p": "Points by station with an offset from the axis.", "t202.h": "Sections (line events)", "t202.p": "Route pieces between two stations.", "g3": "3. Live layers", "t301.h": "Live layer of point events", "t301.p": "A layer recalculated after edits of the source data.", "t302.h": "Live layer of sections", "t302.p": "The same for sections.", "g4": "4. Chainage and locating", "t401.h": "Picket stakeout", "t401.p": "Points of whole pickets with station equations taken into account.", "t402.h": "Locate points on routes", "t402.p": "Measure, station and offset for every point.", "g5": "5. Profiles", function apply(lang){
  var d = TEXTS[lang] || TEXTS.ru;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n')];
    if (value !== undefined) el.innerHTML = value;
  });
  document.querySelectorAll('[data-i18n-attr]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n-attr')];
    if (value !== undefined) el.setAttribute('content', value);
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang') === lang);
  });
  try { localStorage.setItem('routeliner-lang', lang); } catch (e) {}
}
document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click', function(){ apply(b.getAttribute('data-lang')); });
});
// По умолчанию русский, страница живёт на русском сайте.
var saved = null;
try { saved = localStorage.getItem('routeliner-lang'); } catch (e) {}
apply(saved || 'ru');
</script>
